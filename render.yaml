# Render blueprint: runs the Knowzone API (apps/server). In Render: New → Blueprint → pick this repo.
# Render asks for every value marked `sync: false` once; copy them from apps/server/.env (never commit them).
# Database changes are not applied here: run `npx prisma migrate deploy` against Supabase yourself, as before.

services:
  - type: web
    name: knowzone-api
    runtime: node
    # Closest Render region to the Supabase database (eu-west-1, Ireland).
    region: frankfurt
    # The free plan sleeps after 15 minutes without requests, and the first request then waits about a minute.
    # Switch to a paid plan (Starter) before real users arrive.
    plan: free
    rootDir: apps/server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Email for data exports and deletion notices: Gmail (SMTP_USER + an app password in SMTP_PASS) or a
      # Resend key once you have a domain. One of the two is required.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_SECRET_HASH
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: APP_URL
        sync: false

  # The website (apps/web): plain HTML, CSS and JavaScript, nothing to build. Its waitlist form posts to
  # knowzone-api above. If you set CORS_ORIGIN on the API, add this site's address to it.
  - type: web
    name: knowzone-web
    runtime: static
    rootDir: apps/web
    buildCommand: echo "Nothing to build"
    staticPublishPath: .
    autoDeploy: true
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /waitlist
        destination: /waitlist.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
